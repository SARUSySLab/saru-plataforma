  - track_id: curitiba
    track_name: "Autódromo de Curitiba"
    length_m: 3695.0
    # Medido 2026-08-13 · 3 arquivos, espalhamento 20 m (o mais apertado do lote).
    # Ex.: data/telemetry/F3/Rubens Barrichello/F309-016/2020-12-02/
    # Rubens Barrichello_F309-016_20201202_165034_Curitiba_4300133_c_1124.xrk
    ref_lat: -25.450509
    ref_lon: -49.195718
    #
    # RESOLVIDO em 2026-08-29, era 3220.0. O TODO anterior pedia confirmar o
    # tracado antes de mexer, e a confirmacao veio de duas direcoes que
    # concordam:
    #   1. telemetria: duas medicoes independentes (integracao de velocidade e
    #      tracado GPS projetado) deram 3645 m, batendo em 8 m entre si;
    #   2. fonte externa: o circuito principal do Autodromo Internacional de
    #      Curitiba (Raul Boesel) tem 3.695 m, 3.707 km no tracado de 1988.
    # Os 3220.0 anteriores nao correspondem a nenhum dos dois, e reprovavam
    # 100% das voltas de Curitiba no gate de fechamento da etapa 6 (fator 0.86,
    # fora da faixa 0.9 a 1.1), o que zerava `trechos` de toda a pista.
    track_map: null
    #
    # GEOMETRIA RE-DERIVADA em 2026-08-29 (script scripts/derivar_curvas.py).
    #
    # Historico: `sector_distances` e as 7 curvas abaixo somavam exatamente os
    # 3220 m ERRADOS (ver acima). Com o comprimento corrigido pra 3695 m essa
    # geometria continuava no ar, deslocada contra uma pista que nao e esta.
    # A fonte upstream (saru-app/services/telemetry-api/config/tracks.yaml,
    # bloco curitiba) tem O MESMO erro de 3220 m, entao nao havia de onde
    # copiar: a unica saida era derivar do proprio dado medido.
    #
    # NAO TEM GPS: as 16 gravacoes de Curitiba no acervo (F309 .xrk, AiM) nao
    # gravam latitude/longitude -- confirmado em `canal_gravado`, nenhuma tem
    # `gps_lat`/`gps_lon` mapeado. O que existe e "Acc Lat" -> canal canonico
    # `lat_acc` (aceleracao lateral, m/s^2). Curvatura de tracado GPS nao da
    # pra calcular; aceleracao lateral e o canal fisico equivalente (curva =
    # forca lateral sustentada), e e a alternativa que a propria tarefa previu.
    #
    # METODO (integral em scripts/derivar_curvas.py, reproduzivel):
    #   1. as 8 melhores voltas validas (fator de fechamento da etapa 6 mais
    #      perto de 1, entre 0.994 e 1.003) tiveram `lat_acc` e `speed`
    #      reamostrados numa grade uniforme de distancia 0-3695 m (a mesma
    #      cascata e o mesmo fechamento da etapa 6: `distance_m` do proprio
    #      arquivo, fechado no comprimento do layout);
    #   2. mediana ponto a ponto entre as 8 voltas (robusta a volta ruim
    #      isolada, sem descartar a volta inteira);
    #   3. curva = trecho onde |lat_acc mediana| sustenta acima de 4.0 m/s^2
    #      (~0.41 g); zona de entrada/saida = extensao do nucleo enquanto
    #      |lat_acc| > 1.3 m/s^2 (histerese); apex = pico de |lat_acc| dentro
    #      do nucleo;
    #   4. validado contra velocidade: todo apex caiu a <=2 m de um minimo
    #      local de `speed` mediana (ver prova de sanidade no relatorio).
    #
    # RESULTADO: 6 curvas, nao 7. A curvatura NAO separa em 2 features
    # limpas o que o levantamento antigo chamava de "Curva 1" e "Esesse":
    # entre 470 m e 862 m o dado mostra 3 sub-picos colados
    # (esquerda 524-620, direita 628-662, esquerda 668-844), com vaos de
    # 6-8 m entre eles -- muito curtos pra serem 2 curvas com reta de
    # verdade no meio (o proximo vao livre medido, pra Curva 2, e de 474 m).
    # Entao os 3 sub-picos viraram UM registro so ("Curva 1 / Esesse"), com a
    # ressalva de que pode ser 2 features historicas fisicamente coladas, nao
    # uma so; o dado nao decide isso sozinho, precisa de inspecao visual do
    # tracado (que esta pista nao tem, por falta de GPS). As outras 5 curvas
    # (Curva 2 a Curva 5 e Última) saem cada uma com 1 sub-pico so, sem essa
    # ambiguidade.
    #
    # `sector_distances` derivado dividindo em tercos por PONTO DE CURVA: as 2
    # fronteiras internas ficam no meio do maior vao livre mais perto de
    # 1231.7 m e 2463.3 m (1/3 e 2/3 de 3695 m), nunca dentro do span de uma
    # curva. A segunda fronteira alvo (2463.3 m) caiu dentro da Curva 4
    # (2366-2590 m) e foi empurrada pro vao livre mais proximo por fora dela
    # (2365.3 m), o que deixa o setor 3 maior que os outros dois -- efeito
    # colateral esperado de nao cortar curva ao meio, nao erro de conta.
    sector_distances: [1231.7, 2365.3, 3695.0]
    corners:
      - {corner_id: T1, label: "Curva 1 / Esesse", s_start: 470.0,  s_apex: 580.0,  s_end: 862.0}
      - {corner_id: T2, label: "Curva 2",          s_start: 1306.0, s_apex: 1436.0, s_end: 1820.0}
      - {corner_id: T3, label: "Curva 3",          s_start: 1832.0, s_apex: 2022.0, s_end: 2272.0}
      - {corner_id: T4, label: "Curva 4",          s_start: 2366.0, s_apex: 2498.0, s_end: 2590.0}
      - {corner_id: T5, label: "Curva 5",          s_start: 2598.0, s_apex: 2730.0, s_end: 2858.0}
      - {corner_id: T6, label: "Última",           s_start: 2970.0, s_apex: 3110.0, s_end: 3374.0}

