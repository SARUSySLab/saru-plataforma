# config/tracks.yaml
# ---------------------------------------------------------------------------
# Catálogo de pistas do SARU LapAnalyzer.
#
# Campos obrigatórios por entrada:
#   track_id            Identificador único snake_case (ex: interlagos_gp).
#                       Deve corresponder ao hint extraído do nome do arquivo
#                       de telemetria para detecção automática.
#   track_name          Nome legível exibido na UI.
#   length_m            Comprimento total da pista [m].
#   sector_distances    Lista com a distância acumulada ao FIM de cada setor [m].
#                       Ex: [1200.0, 2600.0, 4309.0] → 3 setores, último = length_m.
#   corners             Lista de curvas. Cada curva:
#     corner_id         Identificador curto (T1, S1, etc.)
#     label             Nome legível para UI e relatório.
#     s_start           Início da freada [m].
#     s_apex            Distância do apex [m].
#     s_end             Fim da zona de saída [m].
#
# Campos opcionais:
#   ref_lat / ref_lon   Coordenada de referência do traçado [graus, WGS84]. Serve
#                       para identificar a pista pelo GPS do arquivo: o centróide
#                       dos fixes da sessão é comparado com esta referência, e a
#                       pista mais próxima dentro do raio de tolerância vence.
#                       NÃO é a linha de chegada — é um ponto qualquer dentro do
#                       traçado, então erro de algumas centenas de metros é
#                       irrelevante.
#
#                       REGRA DURA: só entra aqui coordenada MEDIDA de arquivo
#                       real do acervo, ou trazida pelo operador com fonte. Nunca
#                       de memória. Coordenada errada faz a detecção casar a pista
#                       errada EM SILÊNCIO — pior que o 422 que pergunta.
#
#                       As presentes hoje foram medidas em 2026-08-13 como mediana
#                       de gps_lat/gps_lon sobre os fixes válidos dos arquivos do
#                       acervo (83 arquivos lidos de 240 candidatos). Espalhamento
#                       entre arquivos do mesmo grupo: 20 a 501 m.
#
#                       AUSENTE = ainda não medida. Não é esquecimento; é falta de
#                       fonte. Faltam 18 das 22, por dois motivos:
#                       · o acervo tem arquivo mas o formato não carrega GPS
#                         (ACC `.ld` só tem G_LAT/G_LON, que é ACELERAÇÃO, não
#                         coordenada): monza_gp, barcelona, nurburgring,
#                         zandvoort, zolder;
#                       · não há arquivo nenhum no acervo: spa_gp, imola,
#                         nurburgring_24h, lemans, lago_maggiore, road_atlanta,
#                         nordschleife_tourist, monza_no_chicane, red_bull_ring,
#                         suzuka, velocita, taruma, brasilia_gp.
#                       TODO(operador): pesquisa preparada em
#                       docs/research/prompt-coordenadas-pistas-2026-08-13.md
#
#                       ATENÇÃO — perfil `gt7_ld` NÃO serve como fonte. Medido:
#                       os três arquivos GT7 do acervo declaram "Interlagos" e
#                       caem todos em 52.83 / -1.38 (Reino Unido), a 9.600 km do
#                       Interlagos real, com espalhamento de 14 m entre si. A
#                       FORMA é verdadeira (bbox 650×1035 m e volta de 4221 m,
#                       iguais às dos arquivos AiM reais) — o que é falso é a
#                       ORIGEM, um placeholder fixo do export. Manter `gt7_ld`
#                       fora da cascata de detecção por coordenada.
#
# Campo gerado automaticamente:
#   track_map           Coordenadas 2D normalizadas [-1, 1]. Null até ser gerado.
#                       GERAÇÃO: após carregar um arquivo de telemetria desta pista,
#                       execute o CLI abaixo para preencher o campo track_map:
#
#                         python -m saru_lapanalyzer.tools.trackmap_cli \
#                           --input data/samples/<sim>/<track>/<arquivo>.ld \
#                           --track-id <track_id> \
#                           --sim <acc|iracing|gt7|ams2>
#
#                       O CLI grava as coordenadas diretamente neste arquivo.
#                       Recomenda-se usar a volta de melhor traçado (sem erros de pista).
# ---------------------------------------------------------------------------

# Raio de aceite do casamento por GPS ("estar no autódromo"), em km. Decisão
# Vitor 2026-08-20, com dado do acervo na mesa: espalhamento interno medido de
# 501 m (interlagos_gp, 29 arquivos) e 475–491 m nos três .vbo do Giaffone;
# pista errada mais próxima do catálogo a 318,8 km (curitiba↔interlagos_gp).
# 5 km = 10× o espalhamento medido, 60× abaixo da separação mínima. O casamento
# só vale quando é ÚNICO dentro do raio — dois candidatos = ninguém ganha.
gps_match_radius_km: 5.0

