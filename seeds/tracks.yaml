  # Autódromo Internacional Nelson Piquet — reaberto 30/11/2025 após a DER-DF
  # regeometrizar três curvas para padrão FIA (12 -> 16 curvas). Não é divergência
  # de medição entre fontes: é geometria diferente.
  #
  # length_m PROVISÓRIO (2026-08-12). 5384 m é o layout completo segundo a pesquisa
  # oficial (GDF/DER-DF, Stock Car 2025). O local tem SEIS configurações e ainda
  # falta o organizador confirmar qual roda no evento. Se ele confirmar layout curto
  # e não souber o número, SUBESTIMAR: `_compute_lap_time` tira o tempo do canal de
  # tempo, não da distância — length_m subestimado mantém as voltas válidas, enquanto
  # superestimado reprova todas no gate de cobertura de 0,70 e produz "nenhuma volta
  # válida", que aparece só como log INFO.
  #
  # NÃO usar as outras três fontes, todas de layouts que não existem mais:
