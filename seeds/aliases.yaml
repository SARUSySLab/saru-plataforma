# ---------------------------------------------------------------------------
# MoTeC .ld real (MoTeC i2 Pro / ChassisSim export) — source auto = "motec_ld".
# Canais Title-Case com espaços. Escalas VALIDADAS vs Porsche MPES 2023 reais
# (Formula Renault Monza, LMP3 Barcelona) por range de valores em 2026-07-01.
# lap_number NÃO é mapeado: "Beacon (Internal)" não é pulso 0/1 (range ±30k);
# o IngestionService segmenta por reset do canal 'distance' (Lap Distance).
#
# Moto (ECU Marelli — SuperBike, validado 2026-07-30 vs arquivo real
# `SuperBike Logs/Motec/20220514-1112402...ld`, 500 Hz): mesmo source_hint
# "motec_ld" (é MoTeC .ld real também), canais em lower_snake em vez de
# Title-Case. Candidatos alternativos abaixo cobrem os dois casos:
#   speed:    v_ref (velocidade de referência do ECU, km/h — mesma grandeza
#             de "Wheel Speed FL", sensor de roda em vez de GPS).
#   throttle: tpd = "throttle position demand" (posição comandada no punho,
#             pré-atuador) — equivalente ao "Throttle Pos" de carro. tp_1/
#             tp_2 são sensores físicos redundantes pós-atuador (par de
#             plausibilidade do ride-by-wire); mapeados à parte como
#             throttle_tps1/throttle_tps2 (canais novos, não substituem
#             `throttle`) — [FÍSICA] confirmar nomenclatura com Vitor.
#   brake:    p_brake_fr (pressão do freio DIANTEIRO). Moto tem 2 circuitos
#             hidráulicos independentes; freio traseiro (p_brake_rr) fica
#             de fora — sem canal canônico "brake_rear" hoje (adicionar é
#             decisão de schema, não deste fix).
#   rpm:      n_eng.
#   lat_acc/lon_acc: "G Force Lat"/"G Force Long" (mesmo math channel do
#             dash, nome sem hífen e abreviado).
#   gear/distance: já batem sem mudança ("Gear"/"Lap Distance" idênticos).
#   steering: NÃO mapeado p/ moto — não existe canal de ângulo de direção
#             (a contrapartida seria ângulo de cambagem/lean `phi_lean`,
#             grandeza física DIFERENTE — não é substituto de steering).
#   suspensão (susp_pos_*) / temp pneu: NÃO mapeados p/ moto — logger só tem
#             1 amortecedor por eixo (s_susp_fr/s_susp_rr), schema atual
#             assume 4 cantos de carro (FL/FR/RL/RR); duplicar o mesmo
#             sensor em fl+fr seria fabricar dado. Gap de arquitetura
#             (schema 2-rodas) à parte — ver docs/testing/
#             telemetry-data-inventory.md §6.
# ---------------------------------------------------------------------------
motec_ld:
  # Alternativas medidas em log real de ECU de moto (`SuperBike Logs/Motec`,
  # 958 mil amostras): `Ground Speed`, `v_ref` e `v_front` estão em km/h como
  # `Wheel Speed FL`, provado pela integral — 58,6 km em 1916 s dá 110 km/h de
  # média, batendo com a mediana do canal; em m/s daria 396 km/h. Mesma unidade,
  # então cabem no mesmo alias. `v_rear` fica de fora: é roda motriz e derrapa.
  speed:
    col: [Wheel Speed FL, Ground Speed, v_ref, v_front]
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  throttle:
    col: [Throttle Pos, tpd]
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  throttle_tps1:
    # Moto only: sensor físico redundante #1 (plausibilidade ride-by-wire).
    col: tp_1
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  throttle_tps2:
    # Moto only: sensor físico redundante #2 (plausibilidade ride-by-wire).
    col: tp_2
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    # Freio real é pressão hidráulica (Bar); normaliza p/ 0-1 como proxy de
    # pedal (loggers .ld não têm posição de pedal de freio). Opcional.
    col: [Brk_Press_Fnt, p_brake_fr]
    unit_in: bar
    unit_out: "0-1"
    normalize_by_max: true
  rpm:
    col: [Engine RPM, n_eng]
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  gear:
    col: Gear
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  steering:
    col: Steered Angle
    unit_in: deg
    unit_out: rad
    scale: 0.0174533
  lat_acc:
    col: [G Force - Lateral, G Force Lat]
    unit_in: G
    unit_out: m/s2
    scale: 9.80665
  lon_acc:
    col: [G Force - Longitudinal, G Force Long]
    unit_in: G
    unit_out: m/s2
    scale: 9.80665
  distance:
    col: Lap Distance
    unit_in: m
    unit_out: m
    scale: 1.0
  susp_pos_fl:
    col: Damper Position - Front L
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_fr:
    col: Damper Position - Front R
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_rl:
    col: Damper Position - Rear L
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_rr:
    col: Damper Position - Rear R
    unit_in: mm
    unit_out: m
    scale: 0.001
  tyre_temp_mid_fl:
    col: Tyre Temp FL
    unit_in: C
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_fr:
    col: Tyre Temp FR
    unit_in: C
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_rl:
    col: Tyre Temp RL
    unit_in: C
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_rr:
    col: Tyre Temp RR
    unit_in: C
    unit_out: "°C"
    scale: 1.0

# ---------------------------------------------------------------------------
# AiM .xrk real (via libxrk) — source auto = "aim_xrk".
# Nomes de canal variam por logger/idioma → `col` aceita LISTA de candidatos
# (ChannelMapper._resolve_col tenta cada um). VALIDADO vs Copa Truck 2025 por
# range de valores em 2026-07-01 (a1459 usa 'Acelerador'/'GPS_*Acc'; a0440
# Cascavel usa 'Ped'/'Freio_Press'/'InlineAcc').
# accel GPS/interno já vem em **g** (range medido ±1.7–2.2, NÃO ±10 m/s²);
# canônico mantido em g p/ display racing (G-G). unit_out=g, scale 1.0 (não
# reescalar). yaw_rate GPS omitido: ruído/spikes ±4500 deg/s inutilizáveis.
# ---------------------------------------------------------------------------
aim_xrk:
  # O datasource entrega uma coluna `lap_number` já resolvida por janela de
  # beacon (ver xrk_file.py). Sem esta declaração o mapper não a via, e a
  # ingestão caía no fallback de "volta única".
  lap_number:
    col: lap_number
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  speed:
    col: GPS Speed
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  throttle:
    # `EDL8_TPS` é a borboleta da ECU do F3 (medido 0,9..100,0 no
    # `f3_bortoleto_interlagos.xrk`); `Ped` é o mesmo canal na instalação do
    # caminhão, em português (medido −6,6..100,3 — o negativo é offset de
    # sensor). Mesma unidade, mesmo alias.
    # `Pedal` é a mesma coisa noutra instalação brasileira (Cascavel,
    # Rafa Lopes). O acervo escreve o mesmo canal de quatro jeitos.
    col: [Acelerador, Ped, Pedal, EDL8_TPS]
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    # Pressão hidráulica normalizada como proxy de pedal — logger AiM não tem
    # posição de pedal de freio.
    #
    # `BRAKE_F` é o eixo dianteiro do F3, medido 4,4..58,1 bar. `Freio_Press` é
    # o mesmo tipo de sinal na instalação do caminhão, com ZERO DESLOCADO:
    # repousa em −1,045 e sobe a +1,085 freando, correlacionando +0,56 com a
    # desaceleração medida pelo GPS. Cheguei a tratá-lo como canal quebrado por
    # olhar só o extremo; olhar a distribuição mostrou o offset.
    #
    # É por isso que a normalização vai da LINHA DE BASE ao pico e não só pelo
    # pico (ver `channel_mapper._convert`): dividir pelo máximo deixava o traço
    # de freio em −0,96 com o piloto fora do pedal.
    col: [BRAKE_F, Freio_Press]
    unit_in: bar
    unit_out: "0-1"
    normalize_by_max: true
  rpm:
    # `EDL8_RPM` é a mesma grandeza na ECU do F3 (medido 561..7131 rpm).
    col: [RPM, EDL8_RPM]
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  lon_acc:
    col: [GPS_InlineAcc, InlineAcc]
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  lat_acc:
    # `LAT_ACC` é o acelerômetro do F3. A unidade não foi assumida pelo nome:
    # ele correlaciona +0,86 com `GPS_LateralAcc` — que este mesmo alias já
    # declara em g — com ajuste de 0,967, ou seja, mesma escala.
    #
    # `LONG_ACC` do mesmo arquivo ficou de FORA do alias de `lon_acc`: contra a
    # derivada da velocidade ele correlaciona só +0,18, então não é a
    # aceleração longitudinal do carro, seja qual for o nome.
    col: [GPS_LateralAcc, LateralAcc, LAT_ACC]
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  gps_lat:
    col: GPS Latitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_lon:
    col: GPS Longitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  steering:
    # STEERING no .xrk do F3 e DESLOCAMENTO DE CREMALHEIRA (unit_type 12 do
    # CHS = mm; fp16 em metros, medido ±0,05 m e identico ao libxrk). Nao ha
    # relacao cremalheira->grau no arquivo, entao o canonico guarda o valor
    # cru e a APRESENTACAO normaliza pra % do esterço maximo da gravacao,
    # declarando (mesma regua do freio por pressao). Converter pra grau aqui
    # seria inventar a relacao de direcao do carro.
    col: STEERING
    unit_in: "-"
    unit_out: "-"
    scale: 1.0

aim_drk:
  lap_number:
    col: lap_number
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  speed:
    col: [Speed, "Speed #1", "Speed #2", SPEED, "Gps Speed", "GPS Speed"]
    unit_in: km/h
    unit_out: m/s
    scale: 0.2777777777777778
  rpm:
    col: [RPM, Engine, rpm, EDL8_RPM]
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  throttle:
    col: [Throttle, Acelerador, Ped, Pedal, EDL8_TPS]
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    col: [Brake, BRAKE_F, Freio_Press]
    unit_in: bar
    unit_out: "0-1"
    normalize_by_max: true
  gps_lat:
    col: gps_latitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_lon:
    col: gps_longitude
    unit_in: deg
    unit_out: deg
    scale: 1.0

aim_gpk:
  speed:
    col: speed
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  gps_lat:
    col: gps_latitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_lon:
    col: gps_longitude
    unit_in: deg
    unit_out: deg
    scale: 1.0

# ---------------------------------------------------------------------------
# AiM Datalog `.DLF` — source = "aim". Logger AiM (TDL/Solo) com GPS + OBD.
# Nomes por extenso, separados por `;` na linha depois de `#DATASTART`, com a
# linha de unidades logo abaixo — as unidades abaixo são as DECLARADAS pelo
# próprio arquivo, medidas nos 80 `.DLF` do acervo (AMG A45/Cup, Interlagos
# 2026, 20 Hz, 50..124 canais por arquivo conforme a config do logger).
#
# NÃO mapeados de propósito:
#   lat_acc:  não existe. O arquivo tem `Accel Longitudinal Y` e `Accel Vertical
#             Z` em g, mas o eixo lateral só aparece como `Gyro Accel Lateral X`
#             em [deg-s] — isso é VELOCIDADE ANGULAR, não aceleração. Chamar de
#             lat_acc seria trocar a grandeza (o mesmo erro que a lei de unidade
#             no topo deste arquivo existe para impedir).
#   brake:    não existe canal de freio — é logger OBD+GPS, sem harness de
#             chassi. Sem pressão nem posição de pedal de freio.
#   steering: não existe canal de ângulo de direção.
#   tyre_*/susp_*: idem — nenhum sensor de canto neste logger.
# Consequência declarada: um `.DLF` abre com os widgets de freio, direção,
# elipse de atrito e pneu degradados. É o logger que não gravou, não a análise
# que falhou.
# ---------------------------------------------------------------------------
aim:
  speed:
    # `Vehicle Speed` vem do OBD/roda; `GPS Speed` é o fallback quando a config
    # do logger não tinha o PID (medido: 78 dos 80 arquivos têm os dois).
    col: [Vehicle Speed, GPS Speed]
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  rpm:
    col: Engine RPM
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  gear:
    col: Gear Position
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  throttle:
    # `Throttle Position` é a borboleta; `OBD Accelerator Pedal Position D` é o
    # pedal. Preferimos a borboleta e caímos no pedal quando ela falta.
    col: [Throttle Position, OBD Accelerator Pedal Position D]
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  lon_acc:
    # MEDIDO (probe_dlf_axis, 2026-08-22, 10 arquivos): o nome AiM segue a
    # CONFIGURAÇÃO da instalação, não o eixo físico. `Accel Vertical Z` é o
    # longitudinal real (corr mediana −0,80 com dv/dt; `Accel Longitudinal Y`
    # marca −0,54 e fica de fallback) e AMBOS gravam desaceleração como +g —
    # a escala NEGATIVA converte g→m/s² e devolve a convenção canônica
    # (frenagem = lon_acc negativo) numa constante só. Aprovado pelo operador
    # em 2026-08-22 (item 3 do censo). IMU morta (caso `#41`, corr ≈ 0) vira
    # canal constante e cai no guard de sensor morto da ingestão.
    col: [Accel Vertical Z, Accel Longitudinal Y]
    unit_in: g
    unit_out: m/s2
    scale: -9.80665
  yaw_rate:
    # `Gyro Accel Vertical Z` é o giro em torno do eixo vertical = yaw rate.
    col: Gyro Accel Vertical Z
    unit_in: deg/s
    unit_out: rad/s
    scale: 0.0174533
  lap_number:
    col: Lap Number
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  distance:
    col: Lap Distance
    unit_in: m
    unit_out: m
    scale: 1.0
  gps_lat:
    col: GPS Latitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_lon:
    col: GPS Longitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_course:
    # O header do arquivo declara `deg`, mas o canal grava DECI-graus —
    # medido no catálogo 2026-08-22: faixa 0–3.599,6 em 61/81 arquivos,
    # confirmado por 3 fontes independentes (catálogo · estudo F-A §7 ·
    # releitura de 6 arquivos na sessão do censo). Mesma classe do vbox
    # logo abaixo (minutos de arco): a peculiaridade da fonte se resolve
    # AQUI, uma vez — a derivação de `lat_acc` da ingestão consome o
    # canônico já em graus.
    col: GPS Course Over Ground
    unit_in: deci-deg
    unit_out: deg
    scale: 0.1

# ---------------------------------------------------------------------------
# Racelogic VBOX .vbo (GPS + CAN logger) — source = "vbox".
# Colunas = códigos curtos de [column names] (ver VboFileDataSource). Velocidade
# em km/h; acelerações em G; lat/long em MINUTOS de arco (convenção VBOX
# West-positivo → grau WGS84: lat ÷60, lon ÷-60). `time` já vem decorrido do
# datasource. Canais VBOX_* dependem do mapa de CAN do carro (podem faltar).
# ---------------------------------------------------------------------------
vbox:
  speed:
    col: velocity
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  lon_acc:
    col: VBOX_accx
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  lat_acc:
    col: VBOX_accy
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  throttle:
    col: VBOX_ath
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    col: VBOX_pbrk
    unit_in: bar
    unit_out: "0-1"
    normalize_by_max: true
  steering:
    # Era o único perfil emitindo deg num canônico que é rad (11 perfis) — o
    # tripwire do contrato (test_channels_contract.py) pegou a deriva.
    col: VBOX_asteer
    unit_in: deg
    unit_out: rad
    scale: 0.0174533
  rpm:
    col: VBOX_rpm
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  gear:
    col: VBOX_gear
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  lap_number:
    col: VBOX_lapnumber
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  gps_lat:
    col: lat
    unit_in: deg
    unit_out: deg
    scale: 0.0166667
  gps_lon:
    col: long
    unit_in: deg
    unit_out: deg
    scale: -0.0166667

# ---------------------------------------------------------------------------
