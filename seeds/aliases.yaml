    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_fr:
    col: tyre_temp_fr
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_rl:
    col: tyre_temp_rl
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_rr:
    col: tyre_temp_rr
