# Contêiner `.dat` LISTHEAD do acervo F3 (25 arquivos, Curitiba 2015, F309-021).
# Nomes e unidades saem do próprio arquivo — cada canal declara nome, unidade e
# faixa em ASCII, e o leitor confere o medido contra o declarado em 48/48.
#
# O que NÃO entra aqui, e por quê (o arquivo tem 48 canais; mapear todos seria
# repetir o erro do perfil `pitoolbox`, que prometia canal que não existe):
#   · `Steering` está em **mm** — é potenciômetro linear na cremalheira, não
#     ângulo. Mapear para `steering` (rad) seria inventar uma conversão.
#   · `Battery Voltage` declara 1167..1255 V. `Box Voltage` dá 11,7..12,4 V no
#     mesmo arquivo: a escala do primeiro está quebrada na origem.
#   · `Gear` declara 1..1 (constante) e `Gear Pot` está em volts.
#   · `Lambda` declara 2,85e6..5,70e6; `Speed ECU`, `Tank Fuel` e `Laps Left`
#     são todos zero.
# Núcleo partilhado da família Pi (chave com `.` = âncora interna, não perfil;
# o tripwire do contrato a ignora). `.dat` LISTHEAD e `.pid` são o MESMO logger
# com o mesmo vocabulário de canal — âncora em vez de cópia: manter duas cópias
# divergiria na primeira correção que alguém fizesse só numa delas (foi assim
# que sete perfis ficaram entregando `g` para um domínio que assume m/s²).
.pi_core: &pi_core
  speed:
    col: Speed
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  distance_m:
    col: Distance
    unit_in: m
    unit_out: m
    scale: 1.0
  throttle:
    # Unidade declarada é "°", mas a faixa é 0,9..100,0 — é percentual com
    # rótulo errado na origem. A faixa manda; o rótulo não.
    col: Throttle Positi
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    # Pressão hidráulica real (0..60 bar), não posição de pedal. Normalizada
    # como proxy de pedal, igual ao que `motec_ld` já faz.
    col: Brake Press F
    unit_in: bar
    unit_out: "0-1"
    normalize_by_max: true
  rpm:
    col: RPM
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  lap_number:
    col: lap_number
    unit_in: "-"
    unit_out: "-"
    scale: 1.0

listhead_dat:
  <<: *pi_core
  lat_acc:
    # Declarado em G no ASCII do `.dat`, com valor REAL em G. Converter aqui é
    # o que impede o erro que zerou o TBI e o Driver Score no perfil `acc`:
    # todo threshold do domínio assume m/s².
    col: Acc Lat
    unit_in: G
    unit_out: m/s2
    scale: 9.80665
  lon_acc:
    col: Acc Long
    unit_in: G
    unit_out: m/s2
    scale: 9.80665

# `pi_pid` = núcleo SEM lat_acc/lon_acc, de propósito (cerimônia 2026-08-22,
# Q3b). No binário `.pid` os canais `Acc Lat`/`Acc Long` declaram scale=0,0 no
# dicionário e saem em CONTAGEM crua 10-bit (medido: 360..607, centro ≈ 512 =
# provável 0 G); herdar o alias do `.dat` multiplicava contagem por 9,80665 e
# emitia ~+4.600 m/s² de lixo com cara de dado — a causa raiz de "pi_pid nunca
# vê frenagem" na calibração de 2026-08-22. Sem par offset/escala arbitrado, o
# canal FICA FORA do canônico (análise degrada com aviso, como o desenho
# prevê). Reabrir quando a bancada P1 (Pi Toolbox) entregar o par
# binário↔export — mesmo gate da escala de damper.
pi_pid: *pi_core

# ---------------------------------------------------------------------------
# TrackAddict (HP Tuners) — Raw CSV de celular. source auto = "trackaddict".
# Formato do track day de 14/08/2026. Verificado contra export real do
# TrackAddict 4.3.5 / Android 9 (25.219 linhas, 20,0 Hz).
#
# As colunas chegam aqui JÁ NORMALIZADAS pelo `TrackAddictCsvDataSource`:
#   * `Speed (Km/h)` é o nome canônico mesmo quando o aparelho declarou MPH — a
#     conversão condicional vive no `load()` porque esta gramática só multiplica
#     por constante fixa, ela não escolhe o fator pela unidade do cabeçalho.
#   * `Lap` já saiu 1-based (no arquivo é 0-based, com o out-lap em 0).
#
# POR QUE NÃO HÁ `lon_acc`/`lat_acc` AQUI — e não é esquecimento.
# O arquivo traz `Accel X/Y/Z` em g, mas o eixo depende de como o celular estava
# no suporte, e o TrackAddict não declara a orientação em lugar nenhum. Medido
# na sessão real (200 fixes de GPS, duas voltas lançadas, acelerômetro agregado
# no intervalo entre fixes): a maior correlação é `Accel X` contra a aceleração
# lateral cinemática (v·ω) em apenas −0,536, e nenhum eixo passa de +0,28 contra
# dv/dt. Isso não sustenta afirmar qual eixo é longitudinal.
# `lon_acc`/`lat_acc` são OPCIONAIS (`_OPTIONAL_CHANNELS`): ausentes, a análise
# de pilotagem degrada com aviso. Mapeados errado, sai um diagrama g-g com os
# eixos trocados e ninguém percebe. Só mapear depois de medir contra uma volta
# de pista com o celular numa orientação conhecida.
#
# ARMADILHA a jusante: a velocidade é GPS-derivada e CONGELADA entre fixes —
# medido: 0 mudanças de `Speed` fora de `GPS_Update == 1`, em 4.317 linhas sem
# fix. GPS a 0,934 Hz contra sensores a 20,0 Hz. Derivar aceleração dessa coluna
# sem filtrar por `GPS_Update` diferencia uma escada: no mesmo trecho, dv/dt cru
# a 20 Hz devolveu picos de −4851 a +2612 m/s².
# ---------------------------------------------------------------------------
trackaddict:
  # OBRIGATÓRIO, e não é decorativo. `_TIMESTAMP_CANDIDATES` do IngestionService
  # é ("TIME", "time", "timestamp") e casa por nome EXATO contra as colunas do
  # arquivo — a coluna daqui chama `Time`, que não casa com nenhum dos três.
  # Sem esta entrada, `_find_timestamp` devolve None, `_compute_lap_time` cai na
  # integração ds/v e o tempo sai absurdo sem erro nenhum: medido na sessão real
  # contra brasilia_gp, a volta de 2:35,138 virou 237:42,409.
  time:
    col: Time
    unit_in: s
    unit_out: s
    scale: 1.0
  speed:
    col: Speed (Km/h)
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  lap_number:
    col: Lap
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  gps_lat:
    col: Latitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
  gps_lon:
    col: Longitude
    unit_in: deg
    unit_out: deg
    scale: 1.0
