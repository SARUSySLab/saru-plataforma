# ─────────────────────────────────────────────────────────────────────────────
# UNIDADE CANÔNICA DE ACELERAÇÃO: m/s². SEM EXCEÇÃO.
#
# Sete perfis — aim_xrk, vbox, pitoolbox, wintax, windarab, fueltech, protune —
# emitiam `unit_out: g`, e são justamente TODOS os formatos de logger real; só
# os simuladores estavam certos. O domínio compara contra limiar em m/s²
# (`braking_lon_acc: -3.0` em sim_profiles.yaml, `_UNDERSTEER_MIN_LAT_ACC = 2.0`
# em analysis_math_channels.py), então um canal em g nunca cruzava nenhum deles:
# fase de frenagem jamais detectada, understeer sempre NaN, raio de curva capado
# no teto.
#
# O erro era ESPELHADO do que o perfil `acc` tinha: lá a tela mentia e o engine
# acertava; aqui a tela acertava (o fator de exibição virava 1,0) e o engine
# errava. Nos dois casos a causa é a mesma — mais de uma unidade viva no mesmo
# canal canônico. Converta AQUI, uma vez; o engine emite m/s² sempre e quem
# exibe converte para g na ponta.
# ─────────────────────────────────────────────────────────────────────────────

# saru_lapanalyzer/infra/mapping/aliases.yaml
# Mapeamento de canais brutos por simulador para nomes canônicos do domínio.
#
# VALIDADO contra arquivo .ld bruto (McLaren 720S GT3 Evo, Barcelona 2023-10-19)
# via ldparser inspect_ld_raw.py em 2026-04-10. Unidades confirmadas pelo
# campo 'unit' do ldChan (não pelo nome do canal).
#
# GT7: colunas de ferramenta UDP gt7telemetry/gt7dashboard.
# AMS2: colunas do SimHub plugin para Automobilista 2.
#
# Estrutura:
#   <sim_id>:
#     <canal_canonico>:
#       col: <nome_coluna_no_arquivo>
#       unit_in: <unidade_entrada>
#       unit_out: <unidade_canônica>
#       scale: <col × scale → canônico>

acc:
  speed:
    col: SPEED
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  throttle:
    col: THROTTLE
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    col: BRAKE
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  clutch:
    col: CLUTCH
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  steering:
    col: STEERANGLE
    unit_in: deg
    unit_out: rad
    scale: 0.017453
  # G_LAT/G_LON do .ld do ACC estão em **g**, apesar de o arquivo DECLARAR m/s2
  # em `ch.unit`. Medido, não suposto: a razão |dv/dt| / |G_LON| — com dv/dt
  # vindo só do canal SPEED, que está correto — dá mediana 9,521 com correlação
  # 0,98 em demo_motec.ld (n=3562) e 9,495 no Ferrari 488 de Hungaroring.
  # Razão ≈ g significa que o canal está em g.
  #
  # Com `scale: 1.0` o engine emitia g rotulado m/s2, o frontend dividia por
  # 9,80665 achando que convertia, e a tela mostrava 0,21 g onde o McLaren 720S
  # GT3 fez 2,02. E contaminava todo limiar do domínio: Trail-Braking Index 0%
  # em 100% das sessões ACC (limiar 0,3 g nunca cruzado), nenhuma fase de
  # frenagem detectada (limiar -3,0), raio de curva capado no teto em 93,6% das
  # amostras, "Uso do grip 6,5%" onde o piloto usou ~66%.
  #
  # A correção é a MESMA que `gt7_ld` e `motec_ld` já fazem: converter aqui, uma
  # vez, e o engine emitir m/s2 sempre. Não corrigir no frontend — os outros
  # consumidores do engine assumem m/s2.
  lat_acc:
    col: G_LAT
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  lon_acc:
    col: G_LON
    unit_in: g
    unit_out: m/s2
    scale: 9.80665
  yaw_rate:
    col: ROTY
    unit_in: rad/s
    unit_out: rad/s
    scale: 1.0
  gear:
    col: GEAR
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  rpm:
    col: RPMS
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  eng_torque:
    col: EN_ET
    unit_in: Nm
    unit_out: Nm
    scale: 1.0
  eng_gear_ratio:
    col: EN_GR
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  lap_number:
    col: LAP_BEACON
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  susp_pos_fl:
    col: SUS_TRAVEL_LF
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_fr:
    col: SUS_TRAVEL_RF
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_rl:
    col: SUS_TRAVEL_LR
    unit_in: mm
    unit_out: m
    scale: 0.001
  susp_pos_rr:
    col: SUS_TRAVEL_RR
    unit_in: mm
    unit_out: m
    scale: 0.001
  wheel_speed_fl:
    col: WHEEL_SPEED_LF
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  wheel_speed_fr:
    col: WHEEL_SPEED_RF
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  wheel_speed_rl:
    col: WHEEL_SPEED_LR
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  wheel_speed_rr:
    col: WHEEL_SPEED_RR
    unit_in: m/s
    unit_out: m/s
    scale: 1.0
  tyre_press_fl:
    col: TYRE_PRESS_LF
    unit_in: psi
    unit_out: kPa
    scale: 6.89476
  tyre_press_fr:
    col: TYRE_PRESS_RF
    unit_in: psi
    unit_out: kPa
    scale: 6.89476
  tyre_press_rl:
    col: TYRE_PRESS_LR
    unit_in: psi
    unit_out: kPa
    scale: 6.89476
  tyre_press_rr:
    col: TYRE_PRESS_RR
    unit_in: psi
    unit_out: kPa
    scale: 6.89476
  tyre_temp_mid_fl:
    col: TYRE_TAIR_LF
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_fr:
    col: TYRE_TAIR_RF
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_rl:
    col: TYRE_TAIR_LR
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  tyre_temp_mid_rr:
    col: TYRE_TAIR_RR
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  brake_temp_fl:
    col: BRAKE_TEMP_LF
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  brake_temp_fr:
    col: BRAKE_TEMP_RF
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  brake_temp_rl:
    col: BRAKE_TEMP_LR
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  brake_temp_rr:
    col: BRAKE_TEMP_RR
    unit_in: "\u00b0C"
    unit_out: "\u00b0C"
    scale: 1.0
  abs_active:
    col: ABS
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  tc_active:
    col: TC
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  bumpstop_force_fl:
    col: BUMPSTOP_FORCE_LF
    unit_in: N
    unit_out: N
    scale: 1.0
  bumpstop_force_fr:
    col: BUMPSTOP_FORCE_RF
    unit_in: N
    unit_out: N
    scale: 1.0
  bumpstop_force_rl:
    col: BUMPSTOP_FORCE_LR
    unit_in: N
    unit_out: N
    scale: 1.0
  bumpstop_force_rr:
    col: BUMPSTOP_FORCE_RR
    unit_in: N
    unit_out: N
    scale: 1.0

