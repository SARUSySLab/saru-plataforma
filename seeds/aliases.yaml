    scale: 1.0

# saru-telemetry-gt7: gateway Go da org (captura GT7 UDP → CSV). Dialeto PRÓPRIO
# (speed_kph, throttle/brake 0-100, rpm, gear) — distinto do perfil `gt7` acima,
# que é do gt7telemetry/gt7dashboard (body_velocity m/s, throttle 0-255).
saru_gt7:
  # Export CSV do SARU Telemetry GT7 (gateway Go da org).
  # A ÚNICA rota de export do gateway é por volta — `GET /api/laps/{id}/export.csv`
  # (mux em vendor/saru-telemetry-gt7/internal/httpapi/server.go), 16 colunas:
  # timestamp, sequence_id, x, y, z, speed_kph, rpm, gear, throttle, brake, fuel,
  # tyre_fl, tyre_fr, tyre_rl, tyre_rr, steering_rad → UMA volta, segmentação por
  # fallback. A 16ª coluna nasceu no submódulo em `4ac00e9`; até `d66b6d5` eram 15.
  # NÃO existe `GET /api/sessions/{id}/export.csv`: quem quer a sessão inteira
  # concatena os CSVs por volta no cliente (frontend `features/data/gt7Merge.ts`),
  # e é esse merge que acrescenta a coluna `lap_number` — daí ela estar mapeada
  # abaixo como opcional. Um comentário anterior aqui descrevia a rota de sessão
  # como se existisse; ela nunca existiu no gateway.
  # timestamp é RFC 3339 (string) — parseado no passo 2b do IngestionService.
  speed:
    col: speed_kph
    unit_in: kph
    unit_out: m/s
    scale: 0.277778
  throttle:
    col: throttle
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  brake:
    col: brake
    unit_in: "%"
    unit_out: "0-1"
    scale: 0.01
  rpm:
    col: rpm
    unit_in: rpm
    unit_out: rpm
    scale: 1.0
  gear:
    col: gear
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  # O gateway já entrega em RADIANO (domain.Sample.SteeringRad, float32) — não há
  # conversão a fazer, só nomear. Sem esta entrada a coluna era exportada e
  # descartada em silêncio no mapeamento.
  steering:
    col: steering_rad
    unit_in: rad
    unit_out: rad
    scale: 1.0
  # lap_number: presente só no export de sessão; ausente no export por volta
  # (o mapper trata como opcional → fallback de segmentação).
  lap_number:
    col: lap_number
    unit_in: "-"
    unit_out: "-"
    scale: 1.0
  gps_x:
    col: x
    unit_in: m
    unit_out: m
    scale: 1.0
  gps_y:
    col: z                 # eixo Z = plano horizontal no GT7
    unit_in: m
    unit_out: m
    scale: 1.0
  tyre_temp_mid_fl:
    col: tyre_fl
    unit_in: "°C"
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_fr:
    col: tyre_fr
    unit_in: "°C"
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_rl:
    col: tyre_rl
    unit_in: "°C"
    unit_out: "°C"
    scale: 1.0
  tyre_temp_mid_rr:
    col: tyre_rr
    unit_in: "°C"
    unit_out: "°C"
    scale: 1.0

