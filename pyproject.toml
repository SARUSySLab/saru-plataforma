[project]
name = "saru-poc-trackday"
version = "0.1.0"
description = "PoC core SARU: do arquivo do piloto ao insight, ponta a ponta num track day"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Leitor nativo AiM .xrk. Isolado porque puxa binario e nao pode travar o setup.
aim = ["libxrk>=0.12"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
saru-poc = "saru_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saru_poc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
